kind = "web"
previewPath = "/"
title = "TradeIt"
version = "1.0.0"
id = "artifacts/tradeit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19582
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/tradeit run dev"

[services.env]
PORT = "19582"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/tradeit", "run", "build"]
publicDir = "artifacts/tradeit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
